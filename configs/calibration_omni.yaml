pattern_cols: 11
pattern_rows: 8
square_size_mm: 30
preview_scale: 0.5
detect_interval: 2

#####-----后视相机-----#####
# 填后视相机自己的序列号。留空会打开枚举到的第一台，可能是主相机。
camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"
serial: ""

#####-----标定板在车体坐标系中的位姿-----#####
# 原点是车体中心。x 朝车头，y 朝左，z 朝上，单位 m。
# board_origin_m 是左上角第一个内角点的位置。车尾为负 x，右侧为负 y。
# 板面朝后视相机、横边水平、竖边竖直时 board_yaw_deg 为 0。
# 绕竖直轴再转时，左正，单位 degree。拍照时车和板都不要动。
board_origin_m: [-1.20, 0.0, 0.35]
board_yaw_deg: 0

#####-----内参，先跑 calibrate_camera_omni 再把结果贴到这里-----#####
camera_matrix: [1823.9963993419956, 0, 711.09463943585467, 0, 1826.2857680471473, 542.72405068229602, 0, 0, 1]
distort_coeffs: [-0.084184390952579208, 0.22930994117456757, 1.0388259828447162e-05, 0.00079329515085383871, 0]
